; 生信模块配置模板；复制为模块根目录的 module.config.ini 后填写。
; 所有相对路径以本文件所在目录为基准；不要写绝对路径。

[module]
; 模块公开名称；字符串；必须与 run.sh 帮助和报告标题一致。
name = example_module
; 阶段脚本语言；填写 python 或 r。两种模板同时存在时，run.sh 只调用这里指定的语言。
language = python
; 模块版本；语义化版本；公开接口变更时递增。
version = 1.0.0
; 模块目的、分析对象和公开产物；字符串；必填。
description = 在这里填写模块目的、对象范围和公开产物

[input]
; 输入数据路径；相对本配置文件；必须存在。
path = data/input.tsv
; 输入主键列；必须唯一并能与其他输入对齐。
id_column = sample_id
; 输入行列含义和 ID 命名空间；按实际数据填写。
row_unit = feature
column_unit = sample
id_namespace = gene_symbol

[analysis]
; 实际算法名称和版本由 module_contract 冻结。
method = replace_with_approved_method
; 有向比较时填写目标组和参照组；无比较时删除这两个键。
target = case
reference = control
; 阈值、校正方法和其他科学参数必须与源码实际消费一致。
p_value_cutoff = 0.05
adjustment = BH
; 只有存在随机步骤且合同已批准时填写固定整数；无随机步骤时删除该键。
; seed = 20260903

[plot.volcano]
; 独立图命名空间；尺寸单位 inch；renderer 必须真实消费这些键。
width = 8
height = 6
; 输出格式；逗号分隔；同一逻辑图的文件在 result/ 下并列。
formats = png,pdf
; 图内字体；必须是运行环境中可解析的字体名称。
font_family = Arial
; 图中文字大小；单位 pt；必须保证目标阅读器可读。
font_size = 10
; 上调、下调和不显著点的颜色；十六进制颜色值；绘图代码必须实际读取。
up_color = #D55E00
down_color = #0072B2
nonsignificant_color = #BDBDBD
; 阈值线颜色；十六进制颜色值；绘图代码必须实际读取。
threshold_color = #4D4D4D

[report]
; 正式报告模板；相对模块根目录；由 report coder 编写一次。
template = report_templates/report_template.docx

[output]
; 运行输出根目录；命令行的 -o 可以覆盖，公开表和图放在其 result/ 下。
root = output
; v2.2 固定平铺编号结果；不要改成嵌套目录。
result_layout = flat

[stages]
; init 独立，不列入 enabled；full 只串联 calculate、plot、report。
enabled = calculate,plot,report,full
